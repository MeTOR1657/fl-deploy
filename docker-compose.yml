name: ${PROJECT_NAME:-g13-web}

services:
  db:
    image: postgres:18-alpine
    container_name: ${PROJECT_NAME:-g13-web}-db
    restart: unless-stopped
    volumes:
      - pf-data:/var/lib/postgresql
      - ./_entrypoint:/docker-entrypoint-initdb.d:ro
    environment:
      TZ: Asia/Bangkok
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?Set POSTGRES_APP_USER in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
    networks:
      - pf-net
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" && PGPASSWORD="$${POSTGRES_APP_PASSWORD}" psql -U "$${POSTGRES_APP_USER}" -d "$${POSTGRES_DB}" -c "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    image: metor1657/campusfix-backend:latest
    pull_policy: always
    container_name: ${PROJECT_NAME:-g13-web}-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: [sh, -c, "pnpm run db:migrate && pnpm run start"]
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_APP_USER:?Set POSTGRES_APP_USER in .env}:${POSTGRES_APP_PASSWORD:?Use URL-safe letters and numbers for this password}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env}}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env}/auth/google/callback}
      CMU_OAUTH_CLIENT_ID: ${CMU_OAUTH_CLIENT_ID:?Set CMU_OAUTH_CLIENT_ID in .env}
      CMU_OAUTH_CLIENT_SECRET: ${CMU_OAUTH_CLIENT_SECRET:?Set CMU_OAUTH_CLIENT_SECRET in .env}
      CMU_OAUTH_REDIRECT_URI: ${CMU_OAUTH_REDIRECT_URI:-https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env}/api/auth/callback}
      UPLOAD_DIR: uploads
    volumes:
      - ./logs:/app/logs
      - uploads:/app/uploads
    networks:
      - pf-net
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    image: metor1657/campusfix-frontend:latest
    pull_policy: always
    container_name: ${PROJECT_NAME:-g13-web}-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
      CMU_OAUTH_CLIENT_ID: ${CMU_OAUTH_CLIENT_ID:?Set CMU_OAUTH_CLIENT_ID in .env}
      CMU_OAUTH_REDIRECT_URI: ${CMU_OAUTH_REDIRECT_URI:-https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env}/api/auth/callback}
    command: [nginx, -g, "daemon off;"]
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-6013}:6000"
    networks:
      - pf-net
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1:6000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pf-data:
    name: ${PROJECT_NAME:-g13-web}-pf-data
  uploads:
    name: ${PROJECT_NAME:-g13-web}-uploads
networks:
  pf-net:
    name: ${PROJECT_NAME:-g13-web}-pf-net
