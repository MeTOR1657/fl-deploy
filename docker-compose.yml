name: ${PROJECT_NAME:-campusfix}

services:
  db:
    image: postgres:18-alpine
    container_name: ${PROJECT_NAME:-campusfix}-db
    restart: unless-stopped
    volumes:
      - pf-data:/var/lib/postgresql
      - ./_entrypoint:/docker-entrypoint-initdb.d:ro
    environment:
      TZ: Asia/Bangkok
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-4321}
      POSTGRES_DB: ${POSTGRES_DB:-faculty_issue_db}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-app_user}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-1234}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - pf-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && PGPASSWORD=$${POSTGRES_APP_PASSWORD} psql -U $${POSTGRES_APP_USER} -d $${POSTGRES_DB} -c 'SELECT 1;'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ../pf-backend
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME:-campusfix}-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: [sh, -c, "pnpm run db:migrate && pnpm run start"]
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_APP_USER:-app_user}:${POSTGRES_APP_PASSWORD:-1234}@db:5432/${POSTGRES_DB:-faculty_issue_db}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_with_at_least_32_characters_for_campusfix}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/auth/google/callback}
      UPLOAD_DIR: uploads
    volumes:
      - ./logs:/app/logs
    networks:
      - pf-net
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ../pf-front
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME:-campusfix}-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:6000"
    networks:
      - pf-net
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1:6000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pf-data:
    name: ${PROJECT_NAME:-campusfix}-pf-data
networks:
  pf-net:
    name: ${PROJECT_NAME:-campusfix}-pf-net
