name: ${PROJECT_NAME:-campusfix}

services:
  db:
    image: postgres:18-alpine
    container_name: ${PROJECT_NAME:-campusfix}-db
    restart: unless-stopped
    volumes:
      - pf-data:/var/lib/postgresql
      - ./_entrypoint:/docker-entrypoint-initdb.d:ro
    environment:
      TZ: Asia/Bangkok
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?Set POSTGRES_APP_USER in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
    networks:
      - pf-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && PGPASSWORD=$${POSTGRES_APP_PASSWORD} psql -U $${POSTGRES_APP_USER} -d $${POSTGRES_DB} -c 'SELECT 1;'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    image: ${BACKEND_IMAGE:-campusfix-backend:latest}
    build:
      context: ../pf-backend
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME:-campusfix}-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: [sh, -c, "pnpm run db:migrate && pnpm run start"]
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_APP_USER:?Set POSTGRES_APP_USER in .env}:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:?Set GOOGLE_REDIRECT_URI in .env}
      CMU_OAUTH_CLIENT_ID: ${CMU_OAUTH_CLIENT_ID:?Set CMU_OAUTH_CLIENT_ID in .env}
      CMU_OAUTH_CLIENT_SECRET: ${CMU_OAUTH_CLIENT_SECRET:?Set CMU_OAUTH_CLIENT_SECRET in .env}
      CMU_OAUTH_REDIRECT_URI: ${CMU_OAUTH_REDIRECT_URI:?Set CMU_OAUTH_REDIRECT_URI in .env}
      UPLOAD_DIR: uploads
    volumes:
      - ./logs:/app/logs
    networks:
      - pf-net
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    image: ${FRONTEND_IMAGE:-campusfix-frontend:latest}
    build:
      context: ../fl-front
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        VITE_CMU_OAUTH_CLIENT_ID: ${CMU_OAUTH_CLIENT_ID}
        VITE_CMU_OAUTH_REDIRECT_URI: ${CMU_OAUTH_REDIRECT_URI}
    container_name: ${PROJECT_NAME:-campusfix}-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-6013}:6000"
    networks:
      - pf-net
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1:6000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pf-data:
    name: ${PROJECT_NAME:-campusfix}-pf-data
networks:
  pf-net:
    name: ${PROJECT_NAME:-campusfix}-pf-net
